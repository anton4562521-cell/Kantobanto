<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B\H</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF3F7;
    --surface: #FFFFFF;
    --rose: #E9598B;
    --rose-deep: #C93F70;
    --purple: #5B2A86;
    --purple-soft: #EDE3F7;
    --yellow: #F5C242;
    --ink: #3A1633;
    --ink-muted: #8B6B80;
    --line: #F3D9E4;
    --shadow: 0 12px 30px -12px rgba(91,42,134,0.18);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  .mark{
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--purple); border-radius: 12px; box-shadow: var(--shadow);
    font-family:'Fraunces', serif; font-weight:700; line-height:1; user-select:none;
  }
  .mark .b{ color: var(--yellow); }
  .mark .slash{ color:#1B0E22; opacity:.85; }
  .mark .h{ color: var(--rose); }
  .mark--sm{ width:40px; height:40px; font-size:18px; }

  header{
    position: sticky; top:0; z-index:40;
    background: rgba(255,243,247,0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; }
  .nav-left{ display:flex; align-items:center; gap:12px; }
  .brandname{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; }

  .catalog{ padding: 36px 0 90px; }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    display:flex; flex-direction:column; gap: 14px;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{ box-shadow: var(--shadow); transform: translateY(-2px); }
  .card-icon{
    width: 100%; height: 96px; border-radius: 16px;
    display:flex; align-items:center; justify-content:center;
    font-size: 40px;
  }
  .card h3{ margin:0; font-family:'Fraunces', serif; font-weight:600; font-size: 17px; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; }
  .price{ font-weight:800; font-size: 16px; color: var(--rose-deep); }

  .qty{
    display:flex; align-items:center; gap:10px;
    background: var(--purple-soft); border-radius: 999px; padding: 4px;
  }
  .qty button{
    width: 28px; height:28px; border-radius:50%; border:none; cursor:pointer;
    background: #fff; color: var(--purple); font-weight:800; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .qty button:hover{ background: var(--purple); color:#fff; }
  .qty span{ min-width: 16px; text-align:center; font-weight:700; font-size: 14px; }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Manrope', sans-serif; font-weight:700; font-size: 15px;
    padding: 14px 26px; border-radius: 999px;
    transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn-primary{ background: var(--rose); color:#fff; box-shadow: var(--shadow); }
  .btn-primary:hover{ background: var(--rose-deep); transform: translateY(-1px); }
  .btn-ghost{ background: transparent; color: var(--purple); border: 1.5px solid var(--purple); }
  .btn-ghost:hover{ background: var(--purple-soft); }

  .cartbar{
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 130%);
    background: var(--purple); color: #fff;
    border-radius: 999px; box-shadow: 0 16px 40px -10px rgba(27,14,34,0.45);
    padding: 10px 10px 10px 22px;
    display:flex; align-items:center; gap: 18px;
    transition: transform .25s ease;
    z-index: 50;
  }
  .cartbar.show{ transform: translate(-50%, 0); }
  .cartbar .info{ font-weight:700; font-size: 14.5px; }
  .cartbar .info b{ color: var(--yellow); }
  .cartbar .btn-primary{ padding: 10px 20px; font-size:14px; }

  .overlay{
    position: fixed; inset:0; background: rgba(58,22,51,0.45);
    display:none; align-items:center; justify-content:center; padding: 20px; z-index: 60;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff; border-radius: 24px; padding: 28px; width: 100%; max-width: 400px;
    box-shadow: 0 30px 60px -12px rgba(27,14,34,0.4);
  }
  .modal h3{ font-family:'Fraunces', serif; margin: 0 0 16px; font-size: 20px; }
  .order-list{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px; max-height:180px; overflow:auto; }
  .order-list li{ display:flex; justify-content:space-between; font-size: 14px; }
  .order-total{ display:flex; justify-content:space-between; font-weight:800; padding-top:12px; border-top:1px dashed var(--line); margin-bottom:18px; }
  label{ font-size: 13px; font-weight:700; color: var(--ink-muted); display:block; margin-bottom:6px; }
  input[type=text], input[type=tel]{
    width:100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    font-family:'Manrope',sans-serif; font-size:14px; margin-bottom: 14px;
  }
  .modal-actions{ display:flex; gap:10px; margin-top: 4px; }
  .modal-actions .btn{ flex:1; }
  .close-x{
    float:right; background:none; border:none; cursor:pointer; font-size:20px; color: var(--ink-muted);
    margin-top:-6px;
  }
  .empty-hint{ font-size: 13.5px; color: var(--ink-muted); text-align:center; padding: 10px 0 4px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* ======= LOADER / INTRO SCREEN ======= */
  html, body{ background: #1B0E22; }
  #loader{
    position: fixed; inset: 0; z-index: 999;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 45%, var(--rose-deep) 0%, var(--purple) 55%, #1B0E22 100%);
    animation: loaderOut .6s ease forwards; animation-delay: 1.05s;
  }
  @keyframes loaderOut{ to{ opacity:0; visibility:hidden; pointer-events:none; } }
  .loader-inner{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .loader-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width: 96px; height: 96px; border-radius: 26px;
    background: var(--purple); box-shadow: 0 24px 55px -12px rgba(233,89,139,0.55);
    font-family:'Fraunces', serif; font-weight:700; font-size: 40px; line-height:1;
    transform: scale(.55); opacity: 0;
    animation: markIn .7s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes markIn{ to{ transform: scale(1); opacity:1; } }
  .loader-mark .b{ color: var(--yellow); }
  .loader-mark .slash{ color:#1B0E22; opacity:.85; }
  .loader-mark .h{ color: var(--rose); }
  .loader-caption{
    font-family:'Manrope', sans-serif; font-weight:700; font-size: 13px;
    letter-spacing: .04em; color:#fbe4ee; opacity:0;
    animation: capIn .5s ease forwards; animation-delay:.45s;
  }
  @keyframes capIn{ to{ opacity:1; } }
  .loader-progress{
    width: 150px; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,0.18); overflow:hidden;
    opacity:0; animation: capIn .4s ease forwards; animation-delay:.45s;
  }
  .loader-progress-bar{
    height:100%; width:0%; border-radius:3px;
    background: linear-gradient(90deg, var(--yellow), var(--rose));
    animation: fillBar .55s ease forwards; animation-delay:.55s;
  }
  @keyframes fillBar{ to{ width:100%; } }

  /* ======= PAGE REVEAL ======= */
  .catalog-reveal{ opacity:0; transform: translateY(8px); animation: pageIn .5s ease forwards; animation-delay: 1.1s; }
  @keyframes pageIn{ to{ opacity:1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <div class="loader-inner">
    <span class="loader-mark"><span class="b">B</span><span class="slash">\</span><span class="h">H</span></span>
    <div class="loader-caption">Открываем сладости…</div>
    <div class="loader-progress"><div class="loader-progress-bar"></div></div>
  </div>
</div>

<header class="catalog-reveal">
  <div class="wrap nav">
    <div class="nav-left">
      <div class="mark mark--sm"><span class="b">B</span><span class="slash">\</span><span class="h">H</span></div>
      <span class="brandname">B\H</span>
    </div>
  </div>
</header>

<section class="catalog wrap catalog-reveal" style="animation-delay:1.18s;">
  <div class="grid" id="grid"></div>
</section>

<div class="cartbar" id="cartbar">
  <div class="info"><b id="cart-count">0</b> шт · <span id="cart-total">0 ₽</span></div>
  <button class="btn btn-primary" onclick="openModal()">Оформить</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" onclick="closeModal()" aria-label="Закрыть">✕</button>
    <h3>Заказ</h3>
    <ul class="order-list" id="order-list"></ul>
    <div class="order-total"><span>Итого</span><span id="order-total-amount">0 ₽</span></div>
    <label for="name">Имя</label>
    <input type="text" id="name" placeholder="Имя">
    <label for="phone">Телефон</label>
    <input type="tel" id="phone" placeholder="+7 ...">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Назад</button>
      <button class="btn btn-primary" onclick="sendOrder()">Отправить</button>
    </div>
  </div>
</div>

<script>
  const TELEGRAM_USERNAME = "Fort00na"; // без @

  const products = [
    { id:1, name:"Капкейк «Розовый бархат»", price:220, emoji:"🧁", bg:"#FDE4ED" },
    { id:2, name:"Макаронс ассорти", price:390, emoji:"🍬", bg:"#EDE3F7" },
    { id:3, name:"Трюфели шоколадные", price:280, emoji:"🍫", bg:"#FFF1D6" },
    { id:4, name:"Печенье с карамелью", price:180, emoji:"🍪", bg:"#FDE4ED" },
    { id:5, name:"Зефир домашний", price:210, emoji:"🍭", bg:"#EDE3F7" },
    { id:6, name:"Торт «Наполеон» (кусок)", price:260, emoji:"🎂", bg:"#FFF1D6" },
  ];

  const cart = {};

  function renderGrid(){
    const grid = document.getElementById('grid');
    grid.innerHTML = products.map(p => `
      <div class="card">
        <div class="card-icon" style="background:${p.bg}">${p.emoji}</div>
        <h3>${p.name}</h3>
        <div class="card-foot">
          <span class="price">${p.price} ₽</span>
          <div class="qty">
            <button onclick="changeQty(${p.id}, -1)" aria-label="Убрать одну штуку">−</button>
            <span id="qty-${p.id}">0</span>
            <button onclick="changeQty(${p.id}, 1)" aria-label="Добавить одну штуку">+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function changeQty(id, delta){
    const current = cart[id] || 0;
    const next = Math.max(0, current + delta);
    if(next === 0){ delete cart[id]; } else { cart[id] = next; }
    document.getElementById(`qty-${id}`).textContent = next;
    updateCartBar();
  }

  function cartItems(){
    return Object.entries(cart).map(([id, qty]) => {
      const p = products.find(pr => pr.id === Number(id));
      return { ...p, qty };
    });
  }

  function updateCartBar(){
    const items = cartItems();
    const count = items.reduce((s,i) => s + i.qty, 0);
    const total = items.reduce((s,i) => s + i.qty * i.price, 0);
    document.getElementById('cart-count').textContent = count;
    document.getElementById('cart-total').textContent = total + ' ₽';
    document.getElementById('cartbar').classList.toggle('show', count > 0);
  }

  function openModal(){
    const items = cartItems();
    const list = document.getElementById('order-list');
    if(items.length === 0){
      list.innerHTML = `<p class="empty-hint">Пусто</p>`;
    } else {
      list.innerHTML = items.map(i => `<li><span>${i.name} × ${i.qty}</span><span>${i.qty * i.price} ₽</span></li>`).join('');
    }
    const total = items.reduce((s,i) => s + i.qty * i.price, 0);
    document.getElementById('order-total-amount').textContent = total + ' ₽';
    document.getElementById('overlay').classList.add('show');
  }

  function closeModal(){
    document.getElementById('overlay').classList.remove('show');
  }

  function sendOrder(){
    const items = cartItems();
    if(items.length === 0){ closeModal(); return; }
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const total = items.reduce((s,i) => s + i.qty * i.price, 0);

    let msg = "Заказ:\n\n";
    items.forEach(i => { msg += `• ${i.name} × ${i.qty} — ${i.qty * i.price} ₽\n`; });
    msg += `\nИтого: ${total} ₽`;
    if(name) msg += `\nИмя: ${name}`;
    if(phone) msg += `\nТелефон: ${phone}`;

    const url = `https://t.me/${TELEGRAM_USERNAME}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
    closeModal();
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  renderGrid();
</script>

</body>
</html>
